Lint/MissingSuper:
  Enabled: false

Layout/LineLength:
  Max: 100

Metrics/ClassLength:
  Max: 150

Metrics/AbcSize:
  Max: 22

Metrics/MethodLength:
  Max: 20

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/BlockLength:
  Max: 40
  Exclude:
  - '**/*_spec.rb'

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Naming/PredicateMethod:
  Exclude:
  - 'lib/shape_up/shapes/triangle.rb'

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3